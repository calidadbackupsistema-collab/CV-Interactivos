  --page:#EEEFF1; --shell:#F7F7F8; --card:#FFFFFF; --solid:#FFFFFF; --panel:#ECEDEF; --panel2:#F5F6F7;
  --ink:#1E2022; --muted:#6C7077; --line:#E2E3E7; --tick:#CDD0D5;
  --navy:#26272B; --on-navy:#FFFFFF; --accent:#C8102E; --accent-soft:#F8DDE1; --deep:#14234A;
  --blue:#3D6FB0; --blue-soft:rgba(61,111,176,.12); --mint:#2F8063; --mint-soft:#DCEDE3; --warn:#A8650F; --warn-soft:#F5E6CF; --dot:rgba(32,34,38,.22);
  --mark:#FCE7A6;
  --shadow:0 30px 60px -40px rgba(30,32,40,.3);
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0E131C; --shell:rgba(16,21,31,.94); --card:rgba(28,35,50,.88); --solid:#1A2130; --panel:rgba(58,70,95,.55); --panel2:rgba(34,43,61,.7);
  --ink:#EEF1F6; --muted:#A9B3C6; --line:rgba(255,255,255,.1); --tick:#4F5B76;
  --navy:#E9EDF4; --on-navy:#131926; --accent:#FF4D63; --accent-soft:rgba(255,77,99,.18); --deep:#0A1330;
  --blue:#8FB4DC; --blue-soft:rgba(143,180,220,.16); --mint:#74CBAF; --mint-soft:rgba(116,203,175,.18); --warn:#F0A855; --warn-soft:rgba(240,168,85,.18); --dot:rgba(233,237,244,.22);
  --mark:rgba(240,168,85,.35); --shadow:0 40px 80px -40px rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0E131C; --shell:rgba(16,21,31,.94); --card:rgba(28,35,50,.88); --solid:#1A2130; --panel:rgba(58,70,95,.55); --panel2:rgba(34,43,61,.7);
  --ink:#EEF1F6; --muted:#A9B3C6; --line:rgba(255,255,255,.1); --tick:#4F5B76;
  --navy:#E9EDF4; --on-navy:#131926; --accent:#FF4D63; --accent-soft:rgba(255,77,99,.18); --deep:#0A1330;
  --blue:#8FB4DC; --blue-soft:rgba(143,180,220,.16); --mint:#74CBAF; --mint-soft:rgba(116,203,175,.18); --warn:#F0A855; --warn-soft:rgba(240,168,85,.18); --dot:rgba(233,237,244,.22);
  --mark:rgba(240,168,85,.35); --shadow:0 40px 80px -40px rgba(0,0,0,.9); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--f-body);overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
button{font:inherit;color:inherit}
h1,h2,h3{font-weight:500;margin:0;letter-spacing:-.02em;text-wrap:balance}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.muted{color:var(--muted)} .small{font-size:12.5px}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.15,.88)}50%{transform:scale(.93,1.07)}70%{transform:scale(1.03,.98)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.shell{max-width:1260px;margin:0 auto;background:var(--shell);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:0 clamp(12px,2.2vw,26px) 26px}
@media (max-width:600px){body{padding-block:12px 24px}.shell{border-radius:22px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;border-radius:99px;padding:10px 16px;font-weight:600;font-size:13.5px;background:var(--navy);color:var(--on-navy);transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:scale(.97)}
:is(.btn,.chipb,.folder,.lp,.circ,.nav a,.see,.cell,.opb,.oem,.pr-l button,.st):focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.btn.acc{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.soft{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.wa{background:#1F9D55;color:#fff}
.circ{width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1);text-decoration:none}
.circ:hover{transform:scale(1.08)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--f-body);padding:2px 8px;border-radius:99px;white-space:nowrap;vertical-align:1px}
.pill.grey{background:var(--panel);color:var(--muted)}
.pill.acc{background:var(--accent);color:#fff}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--panel);font-size:12px;font-weight:600}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.see{font-size:12px;color:var(--muted);text-decoration:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;padding:0}
.see:hover{color:var(--ink)}

/* Barra superior */
.top{position:sticky;top:0;z-index:30;background:var(--shell);border-radius:30px 30px 0 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px 12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.me{width:40px;height:40px;border-radius:50%;flex:none;background:var(--deep) var(--photo) center 30%/150% no-repeat;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--accent)}
.brand:hover .me{animation:jelly .7s}
.brand b{display:block;font-size:14px;font-weight:700;line-height:1.15}
.brand small{display:block;font:400 11px var(--f-mono);color:var(--muted)}
.nav{display:flex;gap:0;margin-left:clamp(0px,1.4vw,20px)}
.nav a{font-size:12.5px;color:var(--muted);text-decoration:none;padding:6px 8px;position:relative;border-radius:8px}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);font-weight:600}
.nav a.on::after{content:"";position:absolute;left:8px;right:8px;bottom:1px;height:2px;border-radius:2px;background:var(--accent)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:99px;padding:0 14px;height:36px;width:min(230px,40vw);color:var(--muted);margin:0}
.search input{border:0;background:transparent;padding:0;height:100%;font:12.5px var(--f-body);color:var(--ink);min-width:0;flex:1}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 2px var(--blue)}
.langsw{display:flex;background:var(--card);border-radius:99px;padding:3px}
.langsw button{border:0;background:none;border-radius:99px;padding:5px 10px;font:600 11.5px var(--f-body);color:var(--muted);cursor:pointer}
.langsw button.on{background:var(--navy);color:var(--on-navy)}
@media (max-width:1200px){.nav{display:none}}
@media (max-width:700px){.tools{margin-left:0;width:100%;flex-wrap:wrap}.search{flex:1;width:auto}.brand{flex:1}}

.strip{margin:4px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:16px;font-size:13px;background:var(--accent-soft)}
.strip .btn{margin-left:auto}
.strip.q{background:var(--warn-soft)}

/* Tablero */
.dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.sub2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.card{background:var(--card);border-radius:22px;padding:22px;min-width:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.card.flat{background:transparent;padding:4px 2px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
@media (max-width:1000px){.dash{grid-template-columns:1fr}}
@media (max-width:620px){.sub2{grid-template-columns:1fr}}

/* Retrato */
.hero-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.portrait{width:96px;height:96px;position:relative;flex:none}
.portrait::before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#26407A,var(--deep) 70%);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent);animation:pulse 2.6s infinite}
.portrait span{position:absolute;inset:-6px 0 0;background:var(--photo) center bottom/contain no-repeat;border-radius:0 0 50% 50%;clip-path:inset(-20% 0 0 0 round 0 0 48px 48px)}
.kicker{display:block;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.hero-h h1{font-size:clamp(25px,3vw,34px);line-height:1.08}
.hero-h .role{font-weight:600;color:var(--accent);font-size:14px;margin-top:4px}
.hero-h .pill{align-self:start;margin-top:6px}
.desc{margin:10px 0 0;color:var(--muted);font-size:12.5px;max-width:64ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.st{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .2s}
.st:hover{transform:translateY(-2px);border-color:var(--accent)}
.st b{font:500 24px/1 var(--f-body);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.st span{font-size:11px;color:var(--muted);line-height:1.25}
@media (max-width:620px){.hero-h{grid-template-columns:auto minmax(0,1fr)}.hero-h .pill{grid-column:1/-1;justify-self:start}.portrait{width:78px;height:78px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Lollipop */
.tr-b{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:end;margin-top:14px}
.big b{display:block;font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.big small{display:block;margin-top:8px;font-size:12px;color:var(--muted);max-width:19ch;line-height:1.4}
.lolli{display:grid;grid-template-columns:repeat(var(--n,10),minmax(0,1fr));height:220px}
.lp{--hh:calc(var(--h) * (100% - 92px));position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:none;border:0;padding:0 0 4px;cursor:pointer;border-radius:99px}
.lp::before{content:"";position:absolute;bottom:0;left:50%;width:42px;margin-left:-21px;height:calc(var(--hh) + 62px);border-radius:99px;background:linear-gradient(180deg,var(--panel2),var(--panel));opacity:0;transform:scaleY(.6);transform-origin:bottom;transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.lp.on::before{opacity:1;transform:none}
.lp .stem{position:relative;width:1.5px;height:var(--hh);background:var(--tick);margin-bottom:10px;transition:height .7s cubic-bezier(.22,1.2,.36,1)}
.lp .stem i{position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--accent)}
.lp.on .stem{background:linear-gradient(var(--accent),var(--tick))}
.lp .lbl{position:relative;width:34px;height:34px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:600 8.5px var(--f-mono);color:var(--muted);transition:background .25s,color .25s;letter-spacing:-.02em}
.lp.on .lbl{background:var(--navy);color:var(--on-navy)}
.lp .tip{position:absolute;bottom:calc(var(--hh) + 70px);left:50%;transform:translateX(-50%) translateY(6px);background:var(--navy);color:var(--on-navy);font:500 11px var(--f-mono);padding:4px 9px;border-radius:99px;white-space:nowrap;opacity:0;transition:.3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:2}
.lp.on .tip{opacity:1;transform:translateX(-50%)}
.lp:hover .stem i{animation:jelly .5s}
.lp.hit .lbl{box-shadow:0 0 0 2px var(--warn)}
@media (max-width:620px){.tr-b{grid-template-columns:1fr}.lolli{height:200px}.lp::before{width:30px;margin-left:-15px}.lp .lbl{width:29px;height:29px;font-size:7.5px}}
.evb{background:var(--panel2);border-radius:18px;padding:14px 16px;margin-top:14px}
.evb h3{font-size:14px;font-weight:600;letter-spacing:-.01em;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.evb h3 i{font-style:normal;font:500 11px var(--f-mono);color:var(--muted);margin-left:auto}
.evl{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.evl li{display:grid;grid-template-columns:8px 1fr;gap:10px;font-size:12.5px;line-height:1.45;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.evl li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:5px}
.evl small{display:block;font:400 11px var(--f-mono);color:var(--muted);margin-top:1px}
.evb .btn{margin-top:12px}

/* Acordeón */
.tm{padding:12px 2px;border-bottom:1px solid var(--line)}
.tm:last-child{border-bottom:0}
.tm-h{display:flex;align-items:center;gap:12px}
.tm-n{flex:1;min-width:0}
.tm-n b{font-size:13.5px;font-weight:600;margin-right:6px}
.tm-n small{display:block;font:400 11.5px var(--f-mono);color:var(--muted);margin-top:1px}
.tm-h .circ{width:30px;height:30px;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tm.open .tm-h .circ{transform:rotate(180deg)}
.tm-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.tm.open .tm-x{grid-template-rows:1fr}
.tm-x>div{overflow:hidden}
.tm-x .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tm-x p{margin:10px 0 0;font-size:12.5px;color:var(--muted);max-width:56ch}
.tm-x .meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--muted)}
.tm-x .meta span{display:inline-flex;align-items:center;gap:5px}
.tm-x .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.av{width:38px;height:38px;flex:none;border-radius:11px;overflow:hidden;display:grid;place-items:center;color:#fff;font:700 11.5px var(--f-body);background:var(--c,#999)}
.av.round{border-radius:50%}
.av .ic{width:17px;height:17px}

/* Escalera de puestos */
.steps{display:flex;flex-direction:column;gap:0;margin:12px 0 4px;position:relative}
.stp{display:grid;grid-template-columns:26px 1fr;column-gap:10px;position:relative;padding-bottom:12px}
.stp:not(:last-child)::before{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:color-mix(in srgb,var(--c) 35%,transparent)}
.stp i{grid-row:span 2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-mono);font-style:normal;color:#fff;background:color-mix(in srgb,var(--c) calc(var(--o)*100%),#9AA0AA)}
.stp:last-child i{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.stp b{font-size:13px;font-weight:600;line-height:1.3;padding-top:3px}
.stp small{font:400 11px var(--f-mono);color:var(--muted)}
.cell.stage{background:color-mix(in srgb,var(--c) calc(14% + var(--o)*24%),transparent);border-color:color-mix(in srgb,var(--c) calc(30% + var(--o)*45%),transparent);position:relative}
.cell.stage+.cell{margin-left:0}
.paper ul.stg{list-style:none;padding:0;margin:0 0 4px}
.paper ul.stg li{font-size:.95em;color:#333}
/* Contacto rápido */
.cn{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:99px;margin-bottom:8px}
.cn .info{flex:1;min-width:0}
.cn b{font-size:12.5px;font-weight:600}
.cn small{display:block;font:400 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn .av{width:34px;height:34px}
.cn .circ{width:30px;height:30px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cn .circ.go{background:var(--accent);color:#fff}

.promo{position:relative;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-height:100%}
.promo::after{content:"";position:absolute;inset:-30% -30% -30% 25%;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.7px);background-size:8px 8px;transform:perspective(320px) rotateY(-28deg) rotateX(18deg) rotateZ(-8deg);-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent);mask-image:radial-gradient(closest-side,#000 30%,transparent);pointer-events:none}
.promo>*{position:relative;z-index:1}
.promo h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.promo p{margin:6px 0 0;font-size:12px;color:var(--muted);max-width:30ch}
.promo .big2{font:500 30px/1 var(--f-body);letter-spacing:-.02em;margin-top:14px}
.promo .go{margin-top:auto;padding-top:16px}
.promo .go .btn{width:100%;justify-content:space-between;background:var(--card);color:var(--ink);font-size:12.5px;padding:10px 14px 10px 18px}
.promo .go .btn:hover{background:var(--navy);color:var(--on-navy)}

.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pg>div{border-left:2px solid var(--lc);padding-left:10px;min-width:0}
.pg span{display:block;font-size:11px;color:var(--muted);line-height:1.3;min-height:2.6em}
.pg b{display:block;font:500 22px var(--f-body);letter-spacing:-.02em;margin:2px 0 8px;white-space:nowrap}
.pg small{display:block;font:400 10.5px var(--f-mono);color:var(--muted);margin-top:6px}
.ticks{display:flex;justify-content:space-between;height:34px;overflow:hidden}
.ticks i{width:2px;border-radius:2px;background:var(--tick);transition:background .4s}
.ticks i.on{background:var(--lc)}

/* Secciones */
section{padding-top:36px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:clamp(24px,3vw,30px)}
.sec-h p{margin:4px 0 0;color:var(--muted);max-width:64ch;font-size:13px}
.sec-h .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Perfil */
.prof{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.prof .card p{margin:0 0 12px;font-size:15px;line-height:1.65;max-width:70ch}
.prof .card p:last-child{margin-bottom:0}
.quote{font-size:17px!important;font-weight:500;letter-spacing:-.01em;border-left:3px solid var(--accent);padding-left:14px}
.cl h3{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.cl .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cl .chips:last-child{margin-bottom:0}
.cl .chip{background:var(--panel2);border:1px solid var(--line);font-size:12.5px;padding:6px 12px}
@media (max-width:860px){.prof{grid-template-columns:1fr}}

/* Transformaciones antes/después */
.seg2{display:inline-flex;background:var(--card);border-radius:99px;padding:4px;position:relative;border:1px solid var(--line)}
.seg2 button{position:relative;z-index:1;border:0;background:none;padding:8px 16px;border-radius:99px;font:600 12.5px var(--f-body);color:var(--muted);cursor:pointer;transition:color .3s}
.seg2 button.on{color:var(--on-navy)}
.seg2 i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:var(--navy);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.seg2.after i{transform:translateX(100%);background:var(--accent)}
.tfs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.tfs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:680px){.tfs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.tfs{grid-template-columns:1fr}}
.tf{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;border:1px solid transparent;text-align:left;transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .2s}
.tf:hover{transform:translateY(-2px);border-color:var(--c)}
.tf .co{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.tf .co i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tf b.t{font-size:13px;font-weight:600;line-height:1.25;min-height:2.5em}
.tf .val{font:500 30px/1 var(--f-body);letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .4s;white-space:nowrap}
.tf .val small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:4px}
.tf .bar{height:8px;border-radius:99px;background:var(--panel);overflow:hidden}
.tf .bar i{display:block;height:100%;border-radius:99px;background:var(--muted);transition:width 1s cubic-bezier(.22,1,.36,1),background .4s}
.tf .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;font:400 11px var(--f-mono);color:var(--muted)}
.tf .delta{font:600 11px var(--f-body);padding:2px 8px;border-radius:99px;background:var(--mint-soft);color:var(--mint);opacity:0;transform:scale(.8);transition:.4s cubic-bezier(.34,1.56,.64,1)}
.tfs.after .tf .val{color:var(--mint)}
.tfs.after .tf .bar i{background:var(--mint)}
.tfs.after .tf .delta{opacity:1;transform:none}
.tfs:not(.after) .tf .val{color:var(--accent)}
.tfs:not(.after) .tf .bar i{background:var(--accent)}

/* Alcance */
.scope{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
@media (max-width:1100px){.scope{grid-template-columns:1fr 1fr}.scope>.card:last-child{grid-column:1/-1}}
@media (max-width:720px){.scope{grid-template-columns:1fr}}
.scope .card{display:flex;flex-direction:column}
.scope .sub{margin:-6px 0 12px;font-size:12px;color:var(--muted)}
/* constelación OEM */
.orbit{position:relative;width:100%;max-width:300px;aspect-ratio:1;margin:4px auto 6px}
.orbit svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit svg circle.ring{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.orbit svg line{stroke:var(--tick);stroke-width:1.2;transition:stroke .3s,stroke-width .3s}
.orbit svg line.on{stroke:var(--accent);stroke-width:2.2}
.orbit .center{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--deep) var(--photo) center 30%/150% no-repeat;box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--accent)}
.oem{position:absolute;transform:translate(-50%,-50%);border:0;cursor:pointer;border-radius:99px;padding:7px 12px;background:var(--card);color:var(--ink);font:700 12px var(--f-body);box-shadow:0 6px 16px -8px rgba(0,0,0,.35),0 0 0 1px var(--line);transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s;white-space:nowrap}
.oem:hover{transform:translate(-50%,-50%) scale(1.08)}
.oem.on{background:var(--accent);color:#fff;box-shadow:0 8px 20px -8px var(--accent)}
.oem-p{background:var(--panel2);border-radius:16px;padding:12px 14px;margin-top:auto}
.oem-p b{font-size:13.5px}
.oem-p p{margin:6px 0 0;font-size:12.5px;line-height:1.45}
.oem-p small{display:block;font:400 11px var(--f-mono);color:var(--muted);margin-top:3px}
/* radar de procesos */
.radial{position:relative;width:100%;max-width:280px;aspect-ratio:1;margin:0 auto}
.radial svg{width:100%;height:100%;transform:rotate(-90deg)}
.radial .trk{fill:none;stroke:var(--panel);stroke-linecap:round}
.radial .arc{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1),opacity .3s,stroke-width .3s;cursor:pointer}
.radial.sel .arc{opacity:.28}
.radial.sel .arc.on{opacity:1}
.radial .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.radial .mid b{display:block;font:500 34px/1 var(--f-body);letter-spacing:-.03em}
.radial .mid span{display:block;font-size:11px;color:var(--muted);max-width:13ch;margin:4px auto 0;line-height:1.3}
.pr-l{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.pr-l button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;border:0;background:none;padding:5px 8px;border-radius:10px;cursor:pointer;text-align:left;font-size:12px}
.pr-l button:hover,.pr-l button.on{background:var(--panel2)}
.pr-l button i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.pr-l button span:last-child{font:500 11px var(--f-mono);color:var(--muted)}
/* pirámide */
.pyr{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:4px}
.lvl{width:var(--w);min-height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 10px;font:600 11.5px var(--f-body);text-align:center;color:#fff;background:var(--c);animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.lvl:hover{transform:scale(1.03)}
.lvl.rep{background:transparent;color:var(--muted);border:1.5px dashed var(--tick);font-weight:500}
.lvl.me2{background:var(--accent)}
.lvl.me2 .me{width:22px;height:22px;box-shadow:0 0 0 2px #fff}
.pyr-f{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:14px;flex-wrap:wrap}
.pyr-f div{flex:1;min-width:80px}
.pyr-f b{display:block;font:500 22px/1 var(--f-body);letter-spacing:-.02em}
.pyr-f span{font-size:11px;color:var(--muted)}

/* Línea de tiempo */
.board{background:var(--solid);border-radius:22px;overflow:hidden}
.grid-wrap{overflow-x:auto}
table.tl{width:100%;border-collapse:separate;border-spacing:0;min-width:1080px;table-layout:fixed}
.tl col.cw{width:230px} .tl col.ct{width:104px}
.tl th,.tl td{padding:5px 2px;border-bottom:1px solid var(--line);vertical-align:middle}
.tl thead th{font-size:10px;font-weight:600;color:var(--muted);text-align:center;padding:14px 2px 10px}
.tl thead th b{display:grid;place-items:center;width:28px;height:28px;margin:4px auto 0;border-radius:50%;font:600 11px var(--f-mono);color:var(--ink);background:var(--panel)}
.tl th.now b{background:var(--accent);color:#fff}
.tl th.now{color:var(--accent)}
.tl td.now{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.tl .who{position:sticky;left:0;z-index:2;background:var(--solid);text-align:left;border-right:1px solid var(--line);padding-left:12px;padding-right:10px}
.tl thead th.who,.tl thead th.tot{vertical-align:bottom;text-align:left;font-size:11px}
.tl tr.sep td{background:var(--panel2);font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 12px}
.who-in{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:0;text-align:left;width:100%}
.who-in b{display:block;font-weight:600;font-size:12.5px;line-height:1.2}
.who-in small{font:400 10.5px var(--f-mono);color:var(--muted)}
.who-in .av{width:34px;height:34px}
.cell{width:100%;min-height:50px;border:1.5px solid transparent;border-radius:13px;background:var(--panel2);padding:5px 9px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;overflow:hidden}
.cell.rest{background:transparent;border:1.5px dashed var(--line);min-height:50px}
.cell.bar{cursor:pointer;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 26%,transparent),color-mix(in srgb,var(--c) 12%,transparent));border-color:color-mix(in srgb,var(--c) 45%,transparent);transition:transform .2s cubic-bezier(.34,1.56,.64,1),border-color .2s}
.cell.bar:hover{transform:translateY(-2px);border-color:var(--c)}
.cell.edu{border-style:dashed}
.cell .pl{font:600 11.5px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cell .rl{font:400 10.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.cell .tag{font:600 9.5px var(--f-body);padding:1px 7px;border-radius:99px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.cell .tag::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
.cell.mini{align-items:center;padding:5px 2px}
.cell.mini .pl{font-size:10.5px}
.cell.bar .pl{color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.tl td.tot{text-align:right;white-space:nowrap;padding-right:14px}
.tl td.tot b{display:block;font:500 14px var(--f-mono)}
.tl td.tot small{font:400 10.5px var(--f-mono);color:var(--muted)}
.board-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Anillo */
.ring-stage{position:relative;height:clamp(440px,48vw,540px);border-radius:22px;overflow:hidden;cursor:grab;touch-action:pan-y;outline:none;background:radial-gradient(90% 70% at 50% 36%,var(--card),var(--panel) 80%)}
.ring-stage.dragging{cursor:grabbing}
.ring-stage:focus-visible{box-shadow:inset 0 0 0 3px var(--blue)}
.scene{position:absolute;inset:0;perspective-origin:50% 34%}
.ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.floor{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(30,34,60,.28),rgba(30,34,60,.08) 62%,transparent 100%)}
.rcard{position:absolute;left:0;top:0;will-change:transform,opacity;user-select:none;-webkit-user-select:none}
.rcard::after{content:"";position:absolute;inset:0;border-radius:calc(var(--cw)*.07);background:#141626;opacity:var(--shade,0);pointer-events:none}
.rcard.front .opc{box-shadow:0 0 0 2px var(--accent),0 calc(var(--cw)*.1) calc(var(--cw)*.2) rgba(0,0,0,.4)}
.readout{position:absolute;left:18px;bottom:16px;max-width:calc(100% - 120px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:5;pointer-events:none;font:400 11.5px var(--f-mono);color:var(--muted)}
.readout b{font:600 13px var(--f-body);color:var(--ink);margin-left:8px}
.rnav{position:absolute;right:14px;bottom:12px;z-index:5;display:flex;gap:6px}
.rhint{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--muted);pointer-events:none}
.opc{width:var(--cw);height:calc(var(--cw)*1.52);font-size:calc(var(--cw)*.062);border-radius:calc(var(--cw)*.07);overflow:hidden;background:#FFFFFF;color:#1D2032;display:flex;flex-direction:column;box-shadow:0 calc(var(--cw)*.08) calc(var(--cw)*.16) rgba(30,34,60,.3)}
.opc-top{background:var(--bd);color:#fff;padding:1em 1em .9em;position:relative}
.opc-k{display:block;font:500 .58em var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.opc-top b{display:block;font:600 1.05em/1.15 var(--f-body);margin-top:.5em;letter-spacing:-.01em;padding-right:1.6em}
.opc-top small{display:block;font-size:.8em;opacity:.85;margin-top:.15em}
.opc-ic{position:absolute;right:.9em;top:.9em;width:1.6em;height:1.6em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.opc-body{padding:.8em 1em;display:flex;flex-direction:column;gap:.5em;flex:1;min-height:0}
.opc-row{display:flex;justify-content:space-between;align-items:center;gap:.5em;font-size:.76em;color:#5C6172}
.opc-row .lbl{font:500 .82em var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#9A9EB0}
.opc-big b{display:block;font:500 2.4em/1 var(--f-body);letter-spacing:-.03em;white-space:nowrap}
.opc-big.txt b{font-size:1.7em}
.opc-big span{display:block;font-size:.8em;color:#5C6172;margin-top:.35em;line-height:1.3}
.opc-bar{height:.45em;border-radius:99px;background:#ECEDF1;overflow:hidden}
.opc-bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.opc-foot{display:flex;justify-content:space-between;align-items:center;padding:.7em 1em .9em;border-top:.12em dashed #DCDEE6;font-size:.72em;color:#5C6172;margin-top:auto}
.opc-team{display:flex}
.mini{min-width:2.3em;height:2.1em;padding:0 .4em;border-radius:99px;background:var(--c);color:#fff;display:grid;place-items:center;font:600 .62em var(--f-mono);border:.15em solid #fff;margin-left:-.4em}
.mini:first-child{margin-left:0}
.ops{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:14px}
.opb{display:flex;flex-direction:column;gap:5px;text-align:left;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;min-width:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .2s}
.opb:hover{transform:translateY(-2px);border-color:var(--c)}
.opb .t{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opb b{font-size:12px;font-weight:600;line-height:1.25}
.opb .n{font:500 20px var(--f-body);letter-spacing:-.02em;white-space:nowrap}
.opb .bar{height:4px;border-radius:99px;background:var(--panel);overflow:hidden;margin-top:auto}
.opb .bar i{display:block;height:100%;background:var(--c);border-radius:99px}
@media (max-width:1100px){.ops{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:620px){.ops{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Carpetas */
.folders{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;padding:10px 0 6px;--n:5}
.folder{--dur:520ms;position:relative;flex:none;width:min(240px,max(150px,calc((100% - (var(--n) - 1) * 20px) / var(--n))));border-radius:var(--r);background:var(--frame);outline:none;cursor:pointer;
  box-shadow:0 22px 30px -18px rgba(30,34,60,.55),0 2px 6px rgba(0,0,0,.1);transition:transform var(--dur) cubic-bezier(.2,.8,.2,1);animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*80ms)}
.folder.open{transform:translateY(-6px)}
.folder .backdrop{position:absolute;inset:var(--f);border-radius:var(--ri);overflow:hidden;background:var(--bd)}

function searchHits(q){ const nq = norm(q);
  const compHit = COMP.filter(c => norm(c.n.es).includes(nq) || norm(c.n.en).includes(nq)).map(c => c.k);
  return BUL.filter(b => norm(b.es).includes(nq) || norm(b.en).includes(nq) || norm(b.job.name).includes(nq) || b.tags.some(k => compHit.includes(k))); }

  paintTF(true);

function paintTF(instant){
  const after = S.tf === 1, box = $('#tfs'), seg = $('#tfSeg');
  box.classList.toggle('after', after); seg.classList.toggle('after', after);
  $$('#tfSeg button').forEach(b => { const on = +b.dataset.s === S.tf; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  cancelAnimationFrame(tfRAF);
  const t0 = performance.now(), dur = instant || reduced ? 0 : 900;
  const step = now => { const p = dur ? Math.min(1, (now - t0)/dur) : 1, e = 1 - Math.pow(1-p, 3);
    TF.forEach((x,i) => { const v = $('[data-v="'+i+'"]'), bar = $('[data-b="'+i+'"]'); if (!v) return;
      if (x.q){ v.textContent = tx(after ? x.at : x.bt); bar.style.width = (after ? 100 : 35) + '%'; return; }
      const from = after ? x.b : x.a, to = after ? x.a : x.b, cur = from + (to - from) * e;
      v.innerHTML = esc(x.fmt(cur)) + (x.unit ? '' : ''); bar.style.width = (to / x.max * 100).toFixed(1) + '%'; });
    if (p < 1) tfRAF = requestAnimationFrame(step); };
  tfRAF = requestAnimationFrame(step);
}
$$('#tfSeg button').forEach(b => b.onclick = () => { const s = +b.dataset.s; if (s === S.tf) return; S.tf = s; paintTF(); });
$('#tfPlay').onclick = () => { S.tf = 0; paintTF(true); setTimeout(() => { S.tf = 1; paintTF(); }, 650); };
let tfSeen = false;
new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting && !tfSeen){ tfSeen = true; S.tf = 0; paintTF(true); setTimeout(() => { S.tf = 1; paintTF(); }, 700); } }), {threshold:.4}).observe($('#tfs'));

    svg += '<circle class="trk" cx="'+C+'" cy="'+C+'" r="'+r+'" stroke-width="'+sw+'" stroke-dasharray="'+(L*sweep).toFixed(2)+' '+L.toFixed(2)+'"/>'+
      '<circle class="arc'+(i === S.proc ? ' on' : '')+'" data-p="'+i+'" cx="'+C+'" cy="'+C+'" r="'+r+'" stroke="'+p.c+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+L.toFixed(2)+'" stroke-dashoffset="'+len.toFixed(2)+'"/>'; });
  svg += '</svg>';

}

function renderTimeline(){

        if (y < r.from || y > end) { h += '<td class="'+(y === NOW ? 'now' : '')+'"><div class="cell rest"></div></td>'; return; }
        const i = r.stages.findIndex(s => s.from === y);
        if (i < 0) return; const s = r.stages[i], last = i === r.stages.length - 1, cEnd = last ? s.to : r.stages[i+1].from - 1, cs = cEnd - y + 1, w = cs >= 2;

      return h + '<td class="tot"><b>'+yrs(r)+' '+esc(t('years'))+'</b><small>'+r.stages.length+' '+esc(t('posts'))+'</small></td></tr>'; }

/* ---------- hojas ---------- */
const sheetOpen = () => $('#sheet').classList.contains('open');
let lastFocus = null;
function openSheet(html, wide){ lastFocus = document.activeElement; const p = $('#panel'); p.className = 'panel' + (wide ? ' wide' : ''); p.innerHTML = html; $('#sheet').classList.add('open'); p.scrollTop = 0;
  p.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
  try { p.focus({preventScroll:true}); } catch(e){ p.focus(); } }
function closeSheet(){ $('#sheet').classList.remove('open'); if (lastFocus && lastFocus.focus) try { lastFocus.focus({preventScroll:true}); } catch(e){} }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen()) closeSheet(); });
const closeBtn = () => '<div class="actions"><button class="btn ghost grow" data-close>'+esc(t('close'))+'</button></div>';
const head = (ti, sub, pre) => '<div class="ph-head">'+(pre||'')+'<div><h2>'+ti+'</h2>'+(sub ? '<small>'+sub+'</small>' : '')+'</div><button class="x" data-close aria-label="'+esc(t('close'))+'">×</button></div>';
const evItem = (b, q) => '<div class="ct"><div class="ct-h">'+coAv(b.job.k, true)+'<div class="grow"><p>'+hl(tx(b), q)+'</p><small>'+esc(b.job.name)+' · '+esc(roleLine(b.job))+' · '+esc(span(b.job))+'</small></div></div><div class="chips">'+b.tags.map(compChip).join('')+'</div></div>';

const stage = $('#ringStage'), scene = $('#scene'), ring = $('#ring');
let cards = [], n = 0, step = 30, R = 300, cw = 170, ch = 258, floor;
function buildRing(){
  ring.innerHTML = ''; floor = document.createElement('div'); floor.className = 'floor'; ring.appendChild(floor); cards = [];
  ACH.forEach((a, i) => { const el = document.createElement('div'); el.className = 'rcard'; el.dataset.i = i; el.innerHTML = opHTML(a); ring.appendChild(el); cards.push({el, ci:i, i}); });
  n = cards.length; step = 360/n; lastFront = -1; layoutRing();
}
function layoutRing(){
  const Wd = stage.clientWidth; if (!Wd || !n) return;
  cw = Math.min(190, Math.max(140, Wd*.16)); ch = cw*1.52; R = Math.max(cw*1.4, Math.min(Wd*.42, cw*n/5.6));
  scene.style.perspective = (Math.max(Wd,700)*1.4) + 'px';
  cards.forEach(c => { const s = c.el.style; s.setProperty('--cw', cw+'px'); s.marginLeft = (-cw/2)+'px'; s.marginTop = (-ch/2)+'px'; });
  const fs = R*2.5; Object.assign(floor.style, {width:fs+'px', height:fs+'px', marginLeft:(-fs/2)+'px', marginTop:(-fs/2)+'px', transform:'translateY('+(ch/2+cw*.12)+'px) rotateX(90deg)'});
}
let lastFront = -1, angle = 0, vel = 0, dragging = false, snap = null, resumeAt = 0, introT = 0, last = performance.now(), visible = false;
const normA = a => ((a%360)+540)%360-180, ease = x => 1-Math.pow(1-x,3), frontIndex = () => ((Math.round(-angle/step)%n)+n)%n;
function goTo(i){ snap = {target: angle + normA(-i*step - angle)}; vel = 0; resumeAt = performance.now() + 3000; }
function frame(tm){
  const dt = Math.min(.05, (tm-last)/1000); last = tm; requestAnimationFrame(frame);
  if (!visible || !n) return;
  if (!dragging){ if (snap){ const d = snap.target - angle; angle += d*Math.min(1, dt*7); if (Math.abs(d) < .03){ angle = snap.target; snap = null; } }
    else { angle += vel*dt; vel *= Math.pow(.05, dt); if (Math.abs(vel) < .5) vel = 0; if (!reduced && tm > resumeAt) angle -= 6*dt; } }
  if (introT < 1) introT = reduced ? 1 : Math.min(1, introT + dt/1.6);
  ring.style.transform = 'rotateX(6deg) rotateY(' + angle + 'deg)';
  const fi = frontIndex();
  for (const c of cards){ const a = c.i*step, world = Math.abs(normA(a+angle)), op = world > 110 ? 1 - .6*Math.min(1,(world-110)/70) : 1;
    const e = ease(Math.max(0, Math.min(1, (introT - c.i/n*.45)/.55)));
    c.el.style.transform = 'rotateY('+(a-(1-e)*70)+'deg) translateZ('+(R*(.15+.85*e))+'px) scale('+(.6+.4*e)+')';
    c.el.style.opacity = (op*e).toFixed(3); c.el.style.setProperty('--shade', (world/180*.45).toFixed(3)); c.el.classList.toggle('front', c.i === fi); }
  const f = cards[fi]; if (f && f.ci !== lastFront){ lastFront = f.ci; const a = ACH[f.ci]; $('#roName').textContent = tx(a.big) + ' · ' + tx(a.lbl); $('#roIdx').textContent = pad(f.ci+1) + ' / ' + pad(ACH.length); }
}
let px = 0, sx = 0, lt = 0, moved = 0, downCard = null;
stage.addEventListener('pointerdown', e => { if (e.target.closest('button') || !n) return; dragging = true; snap = null; vel = 0; px = sx = e.clientX; lt = performance.now(); moved = 0;
  downCard = e.target.closest('.rcard'); stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if (!dragging) return; const now = performance.now(), dx = e.clientX - px, k = 57.3/Math.max(120,R)*.9;
  angle += dx*k; vel = dx*k/Math.max(.008,(now-lt)/1000); px = e.clientX; lt = now; moved = Math.max(moved, Math.abs(e.clientX - sx)); });
const endDrag = () => { if (!dragging) return; dragging = false; stage.classList.remove('dragging'); if (performance.now() - lt > 80) vel = 0; resumeAt = performance.now() + 2500;
  if (moved < 5 && downCard){ const i = +downCard.dataset.i; if (i === frontIndex()) achSheet(ACH[i].k); else goTo(i); } };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('keydown', e => { if (!n || sheetOpen()) return; if (e.key === 'ArrowRight'){ goTo(frontIndex()+1); e.preventDefault(); } if (e.key === 'ArrowLeft'){ goTo(frontIndex()-1); e.preventDefault(); } if (e.key === 'Enter'){ achSheet(ACH[frontIndex()].k); e.preventDefault(); } });

new IntersectionObserver(es => es.forEach(x => visible = x.isIntersecting)).observe(stage);

const FP = {aspect:.74, tabWidth:.6, notch:26, radius:24, frame:7, top:.02, height:.5, drop:.48, scale:.92, closedOffset:.22, duration:520};
let folderEls = [];
function folderPath(w, h, tp, tabX, nn, rr){
  const c = Math.max(0, Math.min(nn*.9, tabX*.3, (w-tabX)*.3)), r1 = Math.min(rr, Math.max(0, tabX-c)), r2 = Math.min(rr, Math.max(0, w-tabX-c)), f = x => x.toFixed(1);
  return 'path("M0,'+f(tp+r1)+' Q0,'+f(tp)+' '+f(r1)+','+f(tp)+' L'+f(tabX-c)+','+f(tp)+' C'+f(tabX)+','+f(tp)+' '+f(tabX)+','+f(tp+nn)+' '+f(tabX+c)+','+f(tp+nn)+' L'+f(w-r2)+','+f(tp+nn)+' Q'+f(w)+','+f(tp+nn)+' '+f(w)+','+f(tp+nn+r2)+' L'+f(w)+','+f(h)+' L0,'+f(h)+' Z")';
}
function buildFolders(){
  const g = $('#folders'); g.innerHTML = ''; folderEls = [];
  DOM.forEach((d, i) => { const c = d.pal, ev = new Set(d.comps.flatMap(k => evFor(k).map(b => b.id))).size;
    const el = document.createElement('article'); el.className = 'folder'; el.tabIndex = 0; el.style.setProperty('--i', i);
    el.setAttribute('role','button'); el.setAttribute('aria-label', tx(d.n));
    Object.entries({'--frame':c.frame,'--bd':c.bd,'--bodyc':c.body,'--bodyfg':c.fg,'--bodydim':c.dim,'--acc':c.acc,'--c':c.c}).forEach(([p,v]) => el.style.setProperty(p,v));
    el.innerHTML = '<div class="backdrop"></div><div class="subj-wrap"><div class="subject"><div class="polaroid"><div class="pi"><svg viewBox="0 0 24 24">'+d.ic+'</svg></div><span class="pn">'+d.comps.map(cShort).join(' · ')+'</span></div></div></div>'+
      '<div class="body"><span class="num">'+t('domK')+'-'+pad(i+1)+'</span><span class="arrow">↗</span><div class="foot"><b>'+esc(tx(d.n))+'</b><span>'+ev+' '+esc(t('domEv'))+' · '+d.know.length+' '+esc(t('domSys'))+'</span><em>'+esc(t('domOpen'))+'</em></div></div>';
    const abrir = () => domSheet(d.k);
    el.addEventListener('pointerenter', ev2 => { if (ev2.pointerType === 'mouse') el.classList.add('open'); });
    el.addEventListener('pointerleave', ev2 => { if (ev2.pointerType === 'mouse') el.classList.remove('open'); });
    let was = false; el.addEventListener('pointerdown', () => { was = el.classList.contains('open'); });
    el.addEventListener('click', ev2 => { if (ev2.pointerType === 'mouse' || !ev2.pointerType || was) return abrir(); folderEls.forEach(f => f !== el && f.classList.remove('open')); el.classList.add('open'); });
    el.addEventListener('focus', () => el.classList.add('open')); el.addEventListener('blur', () => el.classList.remove('open'));
    el.addEventListener('keydown', ev2 => { if (sheetOpen()) return; if (ev2.key === 'Enter' || ev2.key === ' '){ ev2.preventDefault(); abrir(); } });
    g.appendChild(el); folderEls.push(el); });
  layoutFolders();
}
function layoutFolders(){
  folderEls.forEach(el => { const w = el.clientWidth; if (!w) return;
    const h = w / FP.aspect; el.style.height = h + 'px';
    const fr = Math.min(FP.frame, w*.08), iw = w - 2*fr, ih = h - 2*fr, ri = Math.max(0, FP.radius - fr), nn = Math.min(FP.notch, ih*.16), tabX = FP.tabWidth*iw;
    const btC = FP.closedOffset*ih, btO = Math.min(ih*.6, Math.max(btC, (FP.top + FP.height)*ih*.9)), set = (k,v) => el.style.setProperty(k,v);
    set('--w', w+'px'); set('--f', fr+'px'); set('--r', FP.radius+'px'); set('--ri', ri+'px'); set('--pad', (w*.075)+'px'); set('--nt', nn+'px');
    set('--bt-c', btC+'px'); set('--bt-o', btO+'px'); set('--clip-c', folderPath(iw, ih, btC, tabX, nn, ri)); set('--clip-o', folderPath(iw, ih, btO, tabX, nn, ri));
    set('--sh', (FP.height*ih)+'px'); set('--sy-o', (FP.top*ih)+'px'); set('--ss-o', FP.scale); set('--sy-c', ((FP.top+FP.drop)*ih)+'px'); set('--ss-c', (FP.scale*.88).toFixed(3)); set('--dur', FP.duration+'ms'); });
}

    '<h4>'+esc(t('cProc'))+'</h4><ul>'+PROC.map(p => '<li>'+esc(tx(p.n))+' ('+p.y+' '+esc(p.y === 1 ? t('year') : t('years'))+')</li>').join('')+'</ul>'+
    '<h4>'+esc(t('cEdu'))+'</h4><ul><li><b>UVM</b> · '+esc(tx(EDU[0].role))+' (2023 – 2026)</li><li><b>UVM</b> · '+esc(tx(EDU[1].role))+' (2025)</li><li><b>ITESRC</b> · '+esc(tx(EDU[2].role))+' (2008 – 2013)</li><li>'+(lang === 'es' ? 'Inglés: avanzado' : 'English: advanced')+'</li></ul>'+
    '<h4>'+esc(t('cKnow'))+'</h4><ul>'+KNOW.map(k => '<li>'+esc(k)+'</li>').join('')+'</ul>'+
    '</aside><main><h1>Alberto García Villarreal</h1><div class="ttl">Quality Manager · IATF 16949</div>'+
    '<h4>'+esc(t('cAbout'))+'</h4>'+tx(P.about).slice(0,2).map(p => '<p>'+esc(p)+'</p>').join('')+
    '<h4>'+esc(t('cAch'))+'</h4><ul>'+[ACH[0],ACH[1],ACH[2],ACH[3],ACH[4],ACH[6]].map(a => '<li><b>'+esc(tx(a.big))+'</b> '+esc(tx(a.lbl))+' — '+esc(jobOf(a.job).short)+'</li>').join('')+'</ul>'+
    '<h4>'+esc(t('cExp'))+'</h4>'+JOBS.map(j => '<div class="job"><div class="jh"><span>'+(j.stages ? esc(j.name) : esc(tx(j.role))+' · '+esc(j.name))+'</span><span>'+esc(span(j))+'</span></div><div class="jr">'+esc(j.place)+', México'+(j.stages ? ' · '+esc(t('evo')).toLowerCase() : '')+'</div>'+
    (j.stages ? '<ul class="stg">'+j.stages.slice().reverse().map(s => '<li><b>'+esc(tx(s.role))+'</b> — '+s.from+' – '+s.to+' ('+s.y+' '+esc(s.y === 1 ? t('year') : t('years'))+')</li>').join('')+'</ul>' : '')+'<ul>'+j.b.map(b => '<li>'+esc(tx(b))+'</li>').join('')+'</ul></div>').join('')+
    '<h4>'+esc(t('cSoft'))+'</h4><p>'+esc(tx(SOFT).join(' · '))+'</p>'+

}

/* ---------- eventos ---------- */
$$('.langsw button').forEach(b => b.onclick = () => { if (b.dataset.lang === lang) return; lang = b.dataset.lang; store.set('cv_ag_lang', lang); render(); toast(t('langT')); });
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value; renderStrips(); renderTracker(); }, 160); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); S.q = e.target.value; renderStrips(); renderTracker(); const h = searchHits(S.q.trim()); if (S.q.trim().length >= 2 && h.length) evSheet(t('results'), '«'+S.q.trim()+'»', h, S.q.trim()); } });
$('#printBtn').onclick = () => window.print();
$('#btnClassic').onclick = classicSheet;

const navLinks = $$('.nav a');
const navObs = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting){ const id = x.target.id === 'resumen' ? 'perfil' : x.target.id; navLinks.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + id)); } }), {rootMargin:'-45% 0px -50% 0px'});
['resumen','impacto','alcance','trayectoria','logros','dominios','vacante','contacto'].forEach(id => navObs.observe(document.getElementById(id)));
const navObs2 = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) navLinks.forEach((a,i) => a.classList.toggle('on', i === 0)); }), {rootMargin:'-45% 0px -50% 0px'});
navObs2.observe($('.dash'));

render();
})();
</script>
